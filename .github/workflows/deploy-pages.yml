name: Deploy web PWA

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build privacy-preserving PWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build and audit
        env:
          VITE_BASE_PATH: /Onboard-Code/
        run: npm run check
      - name: Publish verified build to gh-pages
        working-directory: .
        run: |
          set -euo pipefail
          deploy_dir="$(mktemp -d)"
          trap 'git worktree remove --force "$deploy_dir" >/dev/null 2>&1 || true' EXIT
          git fetch origin gh-pages
          git worktree add --detach "$deploy_dir" origin/gh-pages
          git -C "$deploy_dir" rm -r --ignore-unmatch -- .
          cp -R apps/web/dist/. "$deploy_dir"/
          touch "$deploy_dir/.nojekyll"
          git -C "$deploy_dir" add -A
          if git -C "$deploy_dir" diff --cached --quiet; then
            echo "Published assets are already current."
            exit 0
          fi
          git -C "$deploy_dir" config user.name "github-actions[bot]"
          git -C "$deploy_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$deploy_dir" commit -m "Publish verified PWA from ${GITHUB_SHA}"
          git -C "$deploy_dir" push origin HEAD:gh-pages
